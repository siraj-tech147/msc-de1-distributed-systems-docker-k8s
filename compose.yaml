services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile

    image: flask-sample-app:1.0.0

    ports:
      - "5000:5000"

    restart: unless-stopped

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s